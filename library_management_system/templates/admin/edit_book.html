{% extends 'admin/base_admin.html' %}
{% block title %}Edit Book — LibraryMS{% endblock %}
{% block page_title %}Edit Book{% endblock %}

{% block content %}
<div class="page-title-block d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h4><i class="fas fa-edit text-gold me-2"></i>Edit Book</h4>
    <p>Update the book details below.</p>
  </div>
  <a href="{{ url_for('admin_books') }}" class="btn btn-outline-navy"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>

<div class="admin-card">
  <div class="admin-card-body">
    <form method="POST" action="{{ url_for('admin_edit_book', book_id=book['id']) }}">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Title <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" value="{{ form['title'] }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Category <span class="text-danger">*</span></label>
          <input type="text" name="category" class="form-control" value="{{ form['category'] }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Author <span class="text-danger">*</span></label>
          <input type="text" name="author" class="form-control" value="{{ form['author'] }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">ISBN</label>
          <input type="text" name="isbn" class="form-control" value="{{ form['isbn'] or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Publisher</label>
          <input type="text" name="publisher" class="form-control" value="{{ form['publisher'] or '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Publication Year</label>
          <input type="number" name="publication_year" class="form-control" value="{{ form['publication_year'] or '' }}" min="1800" max="2099">
        </div>
        <div class="col-md-3">
          <label class="form-label">Total Quantity <span class="text-danger">*</span></label>
          <input type="number" name="quantity" class="form-control" value="{{ form['quantity'] }}" min="1" required>
          <div class="form-text">Currently available: {{ book['available_quantity'] }}</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Shelf / Location</label>
          <input type="text" name="shelf" class="form-control" value="{{ form['shelf'] or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Cover Image Filename</label>
          <input type="text" name="cover_image" class="form-control" value="{{ form['cover_image'] or '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ form['description'] or '' }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-gold"><i class="fas fa-save me-2"></i>Save Changes</button>
          <a href="{{ url_for('admin_books') }}" class="btn btn-outline-navy">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
