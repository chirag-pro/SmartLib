{% extends 'admin/base_admin.html' %}
{% block title %}Add Book — LibraryMS{% endblock %}
{% block page_title %}Add Book{% endblock %}

{% block content %}
<div class="page-title-block d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h4><i class="fas fa-plus-circle text-gold me-2"></i>Add New Book</h4>
    <p>Fill in the details to add a new book to the collection.</p>
  </div>
  <a href="{{ url_for('admin_books') }}" class="btn btn-outline-navy"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>

<div class="admin-card">
  <div class="admin-card-body">
    <form method="POST" action="{{ url_for('admin_add_book') }}">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Title <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" value="{{ form.get('title','') }}" placeholder="Book title" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Category <span class="text-danger">*</span></label>
          <input type="text" name="category" class="form-control" value="{{ form.get('category','') }}" placeholder="e.g. Python" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Author <span class="text-danger">*</span></label>
          <input type="text" name="author" class="form-control" value="{{ form.get('author','') }}" placeholder="Author name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">ISBN</label>
          <input type="text" name="isbn" class="form-control" value="{{ form.get('isbn','') }}" placeholder="978-X-XXXX-XXXX-X">
        </div>
        <div class="col-md-6">
          <label class="form-label">Publisher</label>
          <input type="text" name="publisher" class="form-control" value="{{ form.get('publisher','') }}" placeholder="Publisher name">
        </div>
        <div class="col-md-3">
          <label class="form-label">Publication Year</label>
          <input type="number" name="publication_year" class="form-control" value="{{ form.get('publication_year','') }}" placeholder="2023" min="1800" max="2099">
        </div>
        <div class="col-md-3">
          <label class="form-label">Quantity <span class="text-danger">*</span></label>
          <input type="number" name="quantity" class="form-control" value="{{ form.get('quantity','1') }}" placeholder="1" min="1" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Shelf / Location</label>
          <input type="text" name="shelf" class="form-control" value="{{ form.get('shelf','') }}" placeholder="e.g. A-1">
        </div>
        <div class="col-md-6">
          <label class="form-label">Cover Image Filename</label>
          <input type="text" name="cover_image" class="form-control" value="{{ form.get('cover_image','') }}" placeholder="e.g. python.jpg">
          <div class="form-text">Filename from static/images/books/ folder</div>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Brief description of the book…">{{ form.get('description','') }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-gold"><i class="fas fa-save me-2"></i>Add Book</button>
          <a href="{{ url_for('admin_books') }}" class="btn btn-outline-navy">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
